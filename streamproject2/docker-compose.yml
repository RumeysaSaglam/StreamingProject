version: '3.8'

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - spark-network

  # Kafka Broker
  kafka_broker:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka_broker
    container_name: kafka_broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_broker:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - spark-network

  # PostgreSQL Database
  airflow_db:
    image: postgres:13
    hostname: airflow_db
    container_name: airflow_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - spark-network

  # Spark Master
  spark-master:
    image: bitnami/spark:3.4
    hostname: spark-master
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=sparkuser
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark-app:/opt/spark-app
      - ./jars:/opt/spark-jars
    networks:
      - spark-network

  # Spark Worker
  spark-worker:
    image: bitnami/spark:3.4
    hostname: spark-worker
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=sparkuser
    volumes:
      - ./spark-app:/opt/spark-app
      - ./jars:/opt/spark-jars
    networks:
      - spark-network

  # Spark Application Runner
  spark-app:
    image: bitnami/spark:3.4
    hostname: spark-app
    container_name: spark-app
    depends_on:
      - spark-master
      - spark-worker
      - kafka_broker
      - airflow_db
    environment:
      - SPARK_MODE=master
      - SPARK_USER=sparkuser
      - HADOOP_USER_NAME=sparkuser
    volumes:
      - ./spark-app:/opt/spark-app
      - ./jars:/opt/spark-jars
    working_dir: /opt/spark-app
    command: >
      bash -c "
        echo 'Waiting for services to be ready...' &&
        sleep 30 &&
        echo 'Starting Spark application...' &&
        /opt/bitnami/spark/bin/spark-submit 
        --master spark://spark-master:7077 
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.0,org.postgresql:postgresql:42.6.0
        --jars /opt/spark-jars/postgresql-42.6.0.jar,/opt/spark-jars/kafka-clients-3.4.0.jar
        --driver-memory 1g 
        --executor-memory 1g 
        --executor-cores 1 
        --num-executors 1
        --conf spark.sql.streaming.checkpointLocation=/tmp/postgres-checkpoint
        --conf spark.streaming.stopGracefullyOnShutdown=true
        /opt/spark-app/spark_streaming.py
      "
    networks:
      - spark-network
    restart: "no"

  # Kafka Topic Creator (runs once to create topic)
  kafka-setup:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - kafka_broker
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...' &&
        cub kafka-ready -b kafka_broker:19092 1 20 &&
        echo 'Creating topic names_topic...' &&
        kafka-topics --create --topic names_topic --partitions 3 --replication-factor 1 --if-not-exists --bootstrap-server kafka_broker:19092 &&
        echo 'Topic created successfully'
      "
    networks:
      - spark-network

  # Python Kafka Producer (Real API data)
  kafka-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: kafka-producer
    depends_on:
      - kafka-setup
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka_broker:19092
      - KAFKA_TOPIC=names_topic
      - STREAMING_DURATION=3600
      - PAUSE_INTERVAL=10
    volumes:
      - ./producer:/app
    networks:
      - spark-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  spark-network:
    driver: bridge